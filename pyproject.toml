[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raiden_shadow"
version = "1.0.0"
description = "Raiden Shadow: an original vertical arcade shooter built on pygame-ce (all assets procedural)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "raiden_shadow" }]
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",  # terrain texture passes (graceful no-op fallback if absent)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-xdist>=3.8",
    "ruff>=0.6",
    "mypy>=1.8",
]
build = [
    "pyinstaller>=6",
]

# The game runs straight from the repo (`python main.py`); source lives in
# src/ as plain modules, deliberately NOT installed as importable packages.
# `pip install -e .` therefore only pulls the runtime dependencies.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run on 8 workers and stop at the FIRST failure. Both halves of that are about
# waiting, which is the only thing this suite costs: it renders whole sectors, so the
# serial run is ~6 minutes; `-n 8` brings it to ~70 s on a 24-core box (verified: the
# failure set is identical serial vs parallel, so the workers are not hiding or
# inventing anything - if a failure ever appears only in one mode, that IS the bug).
# `--maxfail=1` ends the run at the first breakage; `--tb=line` keeps each one to a
# readable line. To see everything: `pytest --maxfail=0`. To run serially (when a
# failure involves processes or timing, e.g. the paint-server tests): `pytest -n 0`.
addopts = "-q --tb=line -p no:warnings --maxfail=1 -n 8"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
